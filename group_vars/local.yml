hostname: arch
timezone: "Europe/Moscow"
default_locale: en_US.UTF-8
locales:
  - en_US.UTF-8
  - ru_RU.UTF-8
ntp_servers:
  - 0.arch.pool.ntp.org
  - 1.arch.pool.ntp.org
  - 2.arch.pool.ntp.org
  - 3.arch.pool.ntp.org
fallback_ntp_servers:
  - 0.pool.ntp.org
  - 1.pool.ntp.org
  - 2.pool.ntp.org
  - 3.pool.ntp.org
initramfs_hooks:
  - systemd
  - autodetect
  - microcode
  - modconf
  - kms
  - keyboard
  - keymap
  - consolefont
  - lvm2
  - block
  - filesystems
  - fsck
grub_set_theme: true
grub_theme_dir: "/usr/share/grub/themes"
grub_theme_name: "kurumi"
grub_set_password: true
grub_superuser: admin
grub_superuser_password: "grub.pbkdf2.sha512.10000.05884F6A1CDC174F4305595F9EB80045F9785A36EE29E72244F8861C97A34D0C984EBA931E638C5BCAB40BC7F1DA1DF78E0B86002807786ADD1469646035D6F4.DDACC3F511A248FFFE39D17537A3421449B05FDD0E4201B600BF3E48A60F854D9C2C63D42AA121D0D5E58DAD656F07E63235D69C20EAA10AB50684B0780DC738"
users:
  - name: jetron
    full_name: Artem Budarin
    shell: /usr/bin/zsh
    additional_groups:
      - wheel
    create_home: true
    append_groups: true
chezmoi_repo_url: "git@github.com:ZaqWasder/dotfiles.git"

# ssh
ssh_server_enabled: true
ssh_server_ports: ['2022']
ssh_client_port: '2022'
ssh_print_motd: true
ssh_print_last_log: true
gpg_keys_dir: "/tmp/gpg"
gpg_public_key_file_path: "{{ gpg_keys_dir }}/public.gpg"
gpg_private_key_file_path: "{{ gpg_keys_dir }}/private.gpg"

---
- name: Set conf_dir variable
  ansible.builtin.set_fact:
    conf_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config"

- name: Install packages
  community.general.pacman:
    name:
      - xdg-user-dirs
    state: present
    update_cache: true
  become: true

- name: Copy user-dirs.conf
  ansible.builtin.copy:
    src: user-dirs.conf
    dest: "{{ conf_dir }}/user-dirs.conf"
    owner: root
    group: root
    mode: '644'
  become: true

- name: Copy user-dirs.defaults
  ansible.builtin.copy:
    src: user-dirs.defaults
    dest: "{{ conf_dir }}/user-dirs.defaults"
    owner: root
    group: root
    mode: '644'
  become: true

- name: Restart and enable xdg-user-dirs-update.service
  ansible.builtin.systemd_service:
    name: xdg-user-dirs-update.service
    state: restarted
    enabled: true
    daemon_reload: true
    scope: user

---
- name: Install packages
  community.general.pacman:
    name:
      - reflector
      - pacman-contrib
    state: present
    update_cache: true
  become: true

- name: Copy pacman config
  ansible.builtin.template:
    src: pacman.conf.j2
    dest: /etc/pacman.conf
    owner: root
    group: root
    mode: '644'
  become: true

- name: Copy reflector config
  ansible.builtin.template:
    src: reflector.conf.j2
    dest: "{{ reflector_conf_dir }}/reflector.conf"
    owner: root
    group: root
    mode: '644'
  become: true

- name: Backup mirrorlist
  ansible.builtin.copy:
    src: "{{ pacman_mirrors_file }}"
    dest: "{{ pacman_mirrors_file }}.backup_{{ now(fmt='%y.%m.%d_%H:%M:%S') }}"
    remote_src: true
    owner: root
    group: root
    mode: '644'
  become: true

- name: Start and enable timers
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - paccache.timer
    - reflector.timer
    - archlinux-keyring-wkd-sync.timer
  become: true

- name: Start and enable services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - reflector.service
    - archlinux-keyring-wkd-sync.service
  become: true

- name: Upgrade system
  community.general.pacman:
    update_cache: yes
    upgrade: yes
  become: true

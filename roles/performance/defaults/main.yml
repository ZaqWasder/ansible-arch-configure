---
device_name: zram0
sysctl_config_dir: /etc/sysctl.d
sysctl_config_file: "{{ sysctl_config_dir }}/99-performance.conf"
sysctl_params:
  - name: vm.swappiness
    value: 150
  - name: vm.page-cluster
    value: 0
  - name: vm.max_map_count
    value: 1048576
  - name: kernel.watchdog
    value: 0
  - name: vm.dirty_expire_centisecs
    value: 1500
  - name: vm.dirty_writeback_centisecs
    value: 100

---
- name: Install zram-generator package
  community.general.pacman:
    name: zram-generator
    state: present
    update_cache: true

- name: Copy zram-generator config
  ansible.builtin.template:
    src: zram-generator.conf.j2
    dest: /etc/systemd/zram-generator.conf
    owner: root
    group: root
    mode: '644'

- name: Start systemd-zram-setup service
  ansible.builtin.systemd_service:
    name: "systemd-zram-setup@{{ device_name }}.service"
    state: started
    enabled: true
    daemon_reload: true

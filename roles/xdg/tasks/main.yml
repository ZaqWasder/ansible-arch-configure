---
- name: Install packages
  community.general.pacman:
    name:
      - xdg-user-dirs
    state: present
    update_cache: true
  become: true

- name: Restart and enable xdg-user-dirs-update.service
  ansible.builtin.systemd_service:
    name: xdg-user-dirs-update.service
    state: restarted
    enabled: true
    daemon_reload: true
    scope: user
